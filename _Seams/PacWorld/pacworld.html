<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PacWorld - Headless Pac-Man (Flask demo)</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #0a0a12; color: #eee; }
    #wrap { display: flex; flex-direction: column; align-items: center; padding: 16px; }
    #c { display: block; background: #0d0d16; border-radius: 8px; }
    #controls {
      position: absolute; top: 20px; left: 20px;
      background: rgba(0,0,0,0.6); padding: 12px; border-radius: 6px;
      z-index: 10; max-width: 230px;
    }
    .btn {
      width: 100%; margin: 4px 0; padding: 6px;
      background: #0066cc; color: #fff; border: none;
      border-radius: 4px; cursor: pointer; font-size: 14px;
    }
    .btn:hover { background: #0055aa; }
    .btn.active { background: #00c07f; }
    .readout { margin-top: 6px; font-family: monospace; font-size: 13px; }
    .val { color: #ffe600; }
    #banner { margin-top: 8px; font-weight: bold; font-size: 15px; min-height: 20px; }
    .help { margin-top: 8px; font-size: 11px; color: #999; }
  </style>
</head>
<body>
  <div id="controls">
    <div><b>PacWorld</b> (Flask demo)</div>
    <div class="help">Arrows/WASD to play</div>
    <button class="btn active" id="m-human" onclick="setMode('human')">Human</button>
    <button class="btn" id="m-greedy" onclick="setMode('greedy')">Greedy bot</button>
    <button class="btn" id="m-random" onclick="setMode('random')">Random bot</button>
    <button class="btn" onclick="reset()">Reset episode</button>
    <div id="banner"></div>
    <div class="readout">score: <span class="val" id="score">0</span></div>
    <div class="readout">episode: <span class="val" id="epscore">0</span></div>
    <div class="readout">lives: <span class="val" id="lives">3</span></div>
    <div class="readout">steps: <span class="val" id="steps">0</span> / 200</div>
  </div>
  <div id="wrap"><canvas id="c"></canvas></div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const CELL = 42;
    let state = null;

    const socket = io();
    socket.on("state", function (s) {
      state = s;
      canvas.width = s.cols * CELL;
      canvas.height = s.rows * CELL;
      updateHud(s);
      draw();
    });

    function updateHud(s) {
      document.getElementById("score").textContent = s.score;
      document.getElementById("epscore").textContent = Math.round(s.episode_score * 10) / 10;
      document.getElementById("lives").textContent = s.lives;
      document.getElementById("steps").textContent = s.steps;
      document.getElementById("m-human").classList.toggle("active", s.mode === "human");
      document.getElementById("m-greedy").classList.toggle("active", s.mode === "greedy");
      document.getElementById("m-random").classList.toggle("active", s.mode === "random");
      const b = document.getElementById("banner");
      if (s.done) {
        b.textContent = s.won ? "MAZE CLEARED +50" : "EPISODE OVER";
        b.style.color = s.won ? "#4ade80" : "#ef4444";
      } else b.textContent = "";
    }

    function setMode(m) { socket.emit("setmode", { mode: m }); fetch("/setmode/" + m); }
    function reset() { fetch("/reset"); }

    function draw() {
      if (!state) return;
      const { cols, rows, grid, pac, ghosts } = state;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const c = grid[y * cols + x];
          const px = x * CELL, py = y * CELL;
          if (c === 0) {
            ctx.fillStyle = "#2b2b45";
            ctx.fillRect(px, py, CELL, CELL);
          } else {
            ctx.fillStyle = (x + y) % 2 ? "#0e0e1a" : "#10101e";
            ctx.fillRect(px, py, CELL, CELL);
          }
        }
      }
      // pellets
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const c = grid[y * cols + x];
          const cx = x * CELL + CELL / 2, cy = y * CELL + CELL / 2;
          if (c === 2) {
            ctx.fillStyle = "#ffd24a";
            ctx.beginPath(); ctx.arc(cx, cy, 4, 0, 2 * Math.PI); ctx.fill();
          } else if (c === 3) {
            ctx.fillStyle = "#ff8c42";
            ctx.beginPath(); ctx.arc(cx, cy, 9, 0, 2 * Math.PI); ctx.fill();
          } else if (c === 4) {
            ctx.fillStyle = "#4ade80";
            ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.PI / 4);
            ctx.fillRect(-7, -7, 14, 14); ctx.restore();
          }
        }
      }
      // ghosts
      ghosts.forEach(function (g) {
        const cx = g[0] * CELL + CELL / 2, cy = g[1] * CELL + CELL / 2;
        ctx.fillStyle = g[2] ? "#60a5fa" : "#ef4444";
        ctx.beginPath();
        ctx.arc(cx, cy, CELL * 0.34, Math.PI, 0);
        ctx.lineTo(cx + CELL * 0.34, cy + CELL * 0.34);
        ctx.lineTo(cx - CELL * 0.34, cy + CELL * 0.34);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.beginPath(); ctx.arc(cx - 6, cy - 2, 3.5, 0, 2 * Math.PI); ctx.fill();
        ctx.beginPath(); ctx.arc(cx + 6, cy - 2, 3.5, 0, 2 * Math.PI); ctx.fill();
      });
      // pac
      const px = pac[0] * CELL + CELL / 2, py = pac[1] * CELL + CELL / 2;
      ctx.fillStyle = "#ffe600";
      ctx.beginPath(); ctx.arc(px, py, CELL * 0.38, 0.35 * Math.PI, 1.65 * Math.PI); ctx.closePath(); ctx.fill();
    }

    const KEYMAP = {
      ArrowUp: 1, ArrowDown: 2, ArrowLeft: 3, ArrowRight: 4,
      w: 1, s: 2, a: 3, d: 4, W: 1, S: 2, A: 3, D: 4,
    };
    document.addEventListener("keydown", function (e) {
      const a = KEYMAP[e.key];
      if (a === undefined) return;
      e.preventDefault();
      if (state && state.mode === "human") socket.emit("move", { action: a });
    });
  </script>
</body>
</html>
