# _Seams.yaml — ROOT: module list (build-up order).
#
# The module order here defines the contiguous global seam numbering, so it
# must match the _Seams.cpp include order. Each module folder owns a
# _Seams.yaml listing exactly the .hxx units it contains.
#
# There is no generator in the tree: Hatch/SyncSeams.py is referenced by
# history but is absent, so _Seams.cpp is hand-maintained. Reconcile this
# file and the module files by hand until that tool lands.
#
# Regenerate: python3 Hatch/SyncSeams.py _Seams.yaml  (tool missing)

project: iGeek
mode: igeek
release_module: TerminalWorld

# Root-level seam gating the Environment/EnvironmentManifest headers. It has
# no module folder because its code lives at the iGeek root, not under _Seams/.
standalone_seams:
  - name: _iGeekEnvironmentCore
    depends: [_iGeekTypingWorldRelease]
    headers: [../Environment.h, ../EnvironmentManifest.h, ../EnvironmentManifest.hpp]
    label: "Testing Gym manifest..."

modules:
  - name: Core
    folder: _Seams/Core
    label: "Core module"
  - name: MazeWorld
    folder: _Seams/MazeWorld
    label: "MazeWorld module"
  - name: ArmWorld
    folder: _Seams/ArmWorld
    label: "ArmWorld module"
  - name: BikeWorld
    folder: _Seams/BikeWorld
    label: "BikeWorld module"
  - name: CarWorld
    folder: _Seams/CarWorld
    label: "CarWorld module"
  - name: CardsWorld
    folder: _Seams/CardsWorld
    label: "CardsWorld module"
  - name: Classical
    folder: _Seams/Classical
    label: "Classical module"
  - name: PacWorld
    folder: _Seams/PacWorld
    label: "PacWorld module"
  - name: PolygonWorld
    folder: _Seams/PolygonWorld
    label: "PolygonWorld module"
  - name: PrisonerWorld
    folder: _Seams/PrisonerWorld
    label: "PrisonerWorld module"
  - name: SpaceWorld
    folder: _Seams/SpaceWorld
    label: "SpaceWorld module"
  - name: SudokuWorld
    folder: _Seams/SudokuWorld
    label: "SudokuWorld module"
  - name: TileWorld
    folder: _Seams/TileWorld
    label: "TileWorld module"
  - name: TypingWorld
    folder: _Seams/TypingWorld
    label: "TypingWorld module"
  - name: Gym
    folder: _Seams/Gym
    label: "Gym module"
  - name: TerminalWorld
    folder: _Seams/TerminalWorld
    label: "TerminalWorld module (release)"
